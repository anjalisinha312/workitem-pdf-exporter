<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Export</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #f3f2f1;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            margin-top: 0;
            color: #323130;
            font-size: 24px;
        }
        .section {
            margin: 30px 0;
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #323130;
            margin-bottom: 15px;
        }
        .input-group {
            margin: 20px 0;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #323130;
            margin-bottom: 8px;
        }
        input[type="text"], select {
            width: 100%;
            max-width: 500px;
            padding: 10px;
            border: 1px solid #605e5c;
            border-radius: 2px;
            font-size: 14px;
        }
        .radio-group {
            display: flex;
            gap: 20px;
            margin: 10px 0;
        }
        .radio-option {
            display: flex;
            align-items: center;
        }
        .radio-option input[type="radio"] {
            margin-right: 8px;
            width: 18px;
            height: 18px;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        button {
            padding: 10px 24px;
            border: none;
            border-radius: 2px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .primary {
            background: #0078d4;
            color: white;
        }
        .primary:hover {
            background: #106ebe;
        }
        .primary:disabled {
            background: #a19f9d;
            cursor: not-allowed;
        }
        .secondary {
            background: #f3f2f1;
            color: #323130;
        }
        .secondary:hover {
            background: #edebe9;
        }
        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            display: none;
        }
        .status-loading {
            background: #fff4ce;
            border-left: 4px solid #ffb900;
        }
        .status-success {
            background: #dff6dd;
            border-left: 4px solid #107c10;
        }
        .status-error {
            background: #fde7e9;
            border-left: 4px solid #a80000;
        }
        .status-progress {
            background: #e1f5fe;
            border-left: 4px solid #0078d4;
        }
        .progress-bar {
            width: 100%;
            height: 24px;
            background: #f3f2f1;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-fill {
            height: 100%;
            background: #0078d4;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }
        .work-item-list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #edebe9;
            border-radius: 4px;
            padding: 10px;
            margin-top: 10px;
        }
        .work-item-row {
            padding: 8px;
            border-bottom: 1px solid #f3f2f1;
            font-size: 13px;
        }
        .work-item-row:last-child {
            border-bottom: none;
        }
        .work-item-id {
            font-weight: 600;
            color: #0078d4;
        }
        .info-box {
            background: #f3f2f1;
            padding: 15px;
            border-radius: 4px;
            border-left: 4px solid #0078d4;
            margin: 20px 0;
        }
        .info-box p {
            margin: 5px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 Bulk Export Work Items</h1>
        
        <div class="section">
            <div class="section-title">Export Method</div>
            <div class="radio-group">
                <div class="radio-option">
                    <input type="radio" id="methodQuery" name="exportMethod" value="query" checked>
                    <label for="methodQuery" style="margin: 0;">Export from Query</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="methodIds" name="exportMethod" value="ids">
                    <label for="methodIds" style="margin: 0;">Export by IDs</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="methodIteration" name="exportMethod" value="iteration">
                    <label for="methodIteration" style="margin: 0;">Export by Iteration</label>
                </div>
            </div>
        </div>
        
        <div class="section" id="querySection">
            <div class="input-group">
                <label for="queryName">Query Name (optional)</label>
                <input type="text" id="queryName" placeholder="Leave empty to use current query">
                <p style="font-size: 12px; color: #605e5c; margin-top: 5px;">
                    💡 If empty, will export all work items from the current query view
                </p>
            </div>
        </div>
        
        <div class="section" id="idsSection" style="display: none;">
            <div class="input-group">
                <label for="workItemIds">Work Item IDs (comma-separated)</label>
                <input type="text" id="workItemIds" placeholder="e.g., 1, 2, 3, 4, 5">
            </div>
        </div>
        
        <div class="section" id="iterationSection" style="display: none;">
            <div class="input-group">
                <label for="iterationPath">Iteration Path</label>
                <input type="text" id="iterationPath" placeholder="e.g., MyProject\\Sprint 1">
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">Output Options</div>
            <div class="radio-group">
                <div class="radio-option">
                    <input type="radio" id="outputSingle" name="outputType" value="single" checked>
                    <label for="outputSingle" style="margin: 0;">Single Combined PDF</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="outputSeparate" name="outputType" value="separate">
                    <label for="outputSeparate" style="margin: 0;">Separate PDFs (ZIP)</label>
                </div>
            </div>
        </div>
        
        <div class="button-group">
            <button class="primary" id="startExportBtn">📥 Start Export</button>
            <button class="secondary" id="previewBtn">👁️ Preview Items</button>
        </div>
        
        <div id="status"></div>
        
        <div id="workItemPreview" style="display: none;">
            <div class="info-box" id="previewInfo"></div>
            <div class="work-item-list" id="workItemList"></div>
        </div>
    </div>
    
    <script src="bulk-export.js"></script>
</body>
</html>
