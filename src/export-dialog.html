<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Export Options</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #f3f2f1;
        }
        .container {
            max-width: 550px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 4px;
            box-shadow: 0 1.6px 3.6px rgba(0,0,0,.132);
        }
        h2 {
            margin-top: 0;
            color: #323130;
            font-size: 20px;
        }
        .work-item-preview {
            background: #f3f2f1;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 25px;
            border-left: 4px solid #0078d4;
        }
        .preview-label {
            font-size: 11px;
            font-weight: 600;
            color: #605e5c;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .preview-value {
            font-size: 14px;
            color: #323130;
            font-weight: 500;
        }
        .section {
            margin: 25px 0;
        }
        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #323130;
            margin-bottom: 12px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .option {
            margin: 0;
        }
        label {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 10px;
            border-radius: 4px;
            transition: background 0.2s;
            font-size: 14px;
        }
        label:hover {
            background: #f3f2f1;
        }
        input[type="checkbox"] {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            justify-content: flex-end;
        }
        button {
            padding: 10px 24px;
            border: none;
            border-radius: 2px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .primary {
            background: #0078d4;
            color: white;
        }
        .primary:hover {
            background: #106ebe;
        }
        .primary:disabled {
            background: #a19f9d;
            cursor: not-allowed;
        }
        .secondary {
            background: #f3f2f1;
            color: #323130;
        }
        .secondary:hover {
            background: #edebe9;
        }
        #status {
            margin-top: 15px;
            padding: 15px;
            border-radius: 4px;
            display: none;
            font-size: 14px;
        }
        .status-loading {
            background: #fff4ce;
            border-left: 4px solid #ffb900;
        }
        .status-success {
            background: #dff6dd;
            border-left: 4px solid #107c10;
        }
        .status-error {
            background: #fde7e9;
            border-left: 4px solid #a80000;
        }
        .note {
            font-size: 12px;
            color: #605e5c;
            margin-top: 10px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="work-item-preview">
            <div class="preview-label">Exporting</div>
            <div class="preview-value" id="workItemInfo">Loading...</div>
        </div>

        <h2>📄 Export to PDF</h2>
        
        <div class="section">
            <div class="section-title">Select Content to Include</div>
            <div class="options-grid">
                <div class="option">
                    <label>
                        <input type="checkbox" id="includeDescription" checked>
                        <span>Description</span>
                    </label>
                </div>
                <div class="option">
                    <label>
                        <input type="checkbox" id="includeComments" checked>
                        <span>Comments</span>
                    </label>
                </div>
                <div class="option">
                    <label>
                        <input type="checkbox" id="includeHistory" checked>
                        <span>Change History</span>
                    </label>
                </div>
                <div class="option">
                    <label>
                        <input type="checkbox" id="includeAttachments" checked>
                        <span>Attachments List</span>
                    </label>
                </div>
                <div class="option">
                    <label>
                        <input type="checkbox" id="includeLinks" checked>
                        <span>Related Items</span>
                    </label>
                </div>
                <div class="option">
                    <label>
                        <input type="checkbox" id="includeAcceptanceCriteria" checked>
                        <span>Acceptance Criteria</span>
                    </label>
                </div>
            </div>
            <p class="note">💡 Tip: Uncheck items you don't need to create a shorter PDF</p>
        </div>

        <div class="buttons">
            <button class="secondary" id="cancelBtn">Cancel</button>
            <button class="primary" id="exportBtn">📥 Export PDF</button>
        </div>

        <div id="status"></div>
    </div>

    <script src="export-dialog.js"></script>
</body>
</html>
